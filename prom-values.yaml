grafana:
  adminPassword: "prom-operator"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    storageSpec: {}
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 4h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    storage: {}
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_URL"
    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
        - matchers:
            - alertname = "RobotShopPaymentAvailabilitySLOBreached"
          receiver: 'slack-notifications'
          continue: false
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#general'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
            text: >-
              *Description:* {{ .CommonAnnotations.description }}
              *Severity:* {{ .CommonLabels.severity }}
              *Runbook:* <{{ .CommonAnnotations.runbook_url }}|Open Runbook>

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
