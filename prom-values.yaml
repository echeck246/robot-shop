grafana:
  adminPassword: "prom-operator"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    storageSpec: {}
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 4h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    storage: {}
    resources:
      requests:
        cpu: 20m
        memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
